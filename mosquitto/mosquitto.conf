# EdgeWatcher - Mosquitto 2.x configuration
# Accept connections from other machines on port 1883 (Mosquitto 2 only listens locally without this)
listener 1883
# No username/password for the demo (security is listed as future work)
allow_anonymous true

# Keep retained messages and persistent sessions on disk across broker restarts
persistence true
persistence_location /mosquitto/data/

# Verbose log, as in the Lesson 3 exercises (shows CONNECT, PUBLISH, PUBACK, Last Will...)
log_dest stdout
log_type all
connection_messages true
log_timestamp true
